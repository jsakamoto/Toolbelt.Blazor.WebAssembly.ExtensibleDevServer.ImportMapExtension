name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  perform-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Add an additional NuGet package source (configured via the "ADDITIONAL_NUGET_SOURCE_URL" repository
      # variable and the "ADDITIONAL_NUGET_SOURCE_TOKEN" repository secret; skipped if either one is not set)
      - name: Add additional NuGet source
        env:
          SOURCE_URL: ${{ vars.ADDITIONAL_NUGET_SOURCE_URL }}
          SOURCE_USERNAME: ${{ github.repository_owner }}
          SOURCE_TOKEN: ${{ secrets.ADDITIONAL_NUGET_SOURCE_TOKEN }}
        run: |
          if [ -z "$SOURCE_URL" ] || [ -z "$SOURCE_TOKEN" ]; then
            echo "The additional NuGet package source is not configured, so this step is skipped."
            exit 0
          fi
          dotnet nuget add source "$SOURCE_URL" --name "AdditionalNuGetSource" --username "$SOURCE_USERNAME" --password "$SOURCE_TOKEN" --store-password-in-clear-text --configfile nuget.config

      # The end-to-end tests drive a Chromium that Playwright downloads the first time they run.
      # Keeping it between runs saves that download. The key follows the test project file, because
      # that is what says which version of Playwright, and so which browser, the tests need.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ImportMapExtension.Test/ImportMapExtension.Test.csproj') }}

      # Every test that builds, publishes or runs the sample app does so in a container, which is
      # what keeps them out of the NuGet cache of the machine they run on. Pulling the image here
      # rather than letting the first of them wait for it keeps the reason for a slow start visible.
      - name: Pull the .NET SDK image the tests build in
        run: docker pull mcr.microsoft.com/dotnet/sdk:10.0.403

      - name: Perform tests
        run: dotnet test --project ./ImportMapExtension.Test/ImportMapExtension.Test.csproj --output detailed
